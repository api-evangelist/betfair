apis:
- aid: betfair:betfair-exchange-stream-api
  name: Betfair Exchange Stream API
  tags:
  - Streaming
  - Real Time
  - Market Data
  - TCP
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.developer.betfair.com/display/1smk3cen4v3lu3yomq5qye0ni/Exchange+Stream+API
  baseURL: tcp+ssl://stream-api.betfair.com:443
  properties:
  - url: https://docs.developer.betfair.com/display/1smk3cen4v3lu3yomq5qye0ni/Exchange+Stream+API
    type: Documentation
  - url: https://github.com/betfair/stream-api-sample-code
    type: SourceCode
  - url: asyncapi/betfair-asyncapi.yml
    type: AsyncAPI
  description: >-
    Low-latency, subscription-based push of market and order changes over a persistent raw SSL/TCP socket
    to stream-api.betfair.com:443. The protocol is CRLF-delimited JSON (one JSON message per line) - NOT
    WebSocket; attempted WebSocket connections are refused. Clients authenticate then send marketSubscription
    / orderSubscription requests and receive market change (mcm) and order change (ocm) messages plus
    connection, status, and heartbeat frames.
- aid: betfair:betfair-vendor-api
  name: Betfair Vendor API
  tags:
  - Vendor
  - Affiliate
  - OAuth2
  - Web Apps
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.developer.betfair.com/display/1smk3cen4v3lu3yomq5qye0ni/Web+Vendor+Facility
  baseURL: https://identitysso.betfair.com
  properties:
  - url: https://docs.developer.betfair.com/display/1smk3cen4v3lu3yomq5qye0ni/Web+Vendor+Facility
    type: Documentation
  description: >-
    The Web Vendor Facility for licensed software vendors building web-based betting applications. Uses
    an OAuth2-style authorization flow so a vendor's web application can obtain access and refresh tokens
    and act on a Betfair customer's behalf, with the vendor able to charge subscriptions via application
    subscription tokens.
